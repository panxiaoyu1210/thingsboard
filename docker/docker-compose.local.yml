# Resource-conscious local topology for the current ThingsBoard source and WAN transport.
name: thingsboard-local

services:
  mock-ns:
    image: ${WAN_TRANSPORT_IMAGE:-thingsboard/tb-wan-transport:4.4.0-SNAPSHOT}
    pull_policy: never
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
      - >-
        exec java -cp /usr/share/tb-wan-transport/bin/tb-wan-transport.jar
        -Dloader.main=org.thingsboard.server.wan.mock.WanMockNsApplication
        org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      MOCK_NS_REQUEST_TOPIC: turmass/ns/requests
      MOCK_NS_RESPONSE_TOPIC: turmass/ns/responses
    ports:
      - "11883:1883"
      - "18080:8080"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", ": > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  zookeeper:
    image: zookeeper:3.8.1
    restart: unless-stopped
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;zookeeper:2181
      ZOO_ADMINSERVER_ENABLED: "false"
    volumes:
      - thingsboard-zookeeper-data:/data
      - thingsboard-zookeeper-log:/datalog

  kafka:
    image: bitnamilegacy/kafka:4.0
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_LOG_RETENTION_BYTES: 1073741824
      KAFKA_CFG_SEGMENT_BYTES: 26214400
    volumes:
      - thingsboard-kafka-data:/bitnami/kafka

  valkey:
    image: bitnamilegacy/valkey:8.0
    restart: unless-stopped
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - thingsboard-valkey-data:/bitnami/valkey/data

  thingsboard:
    build:
      context: ../msa/tb/target/docker-postgres
    image: ${THINGSBOARD_IMAGE:-thingsboard/tb-postgres:4.4.0-SNAPSHOT}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - kafka
      - valkey
      - zookeeper
    ports:
      - "19090:9090"
      - "11884:1883"
      - "15683:5683/udp"
      - "15685:5685/udp"
      - "15686:5686/udp"
    environment:
      TB_SERVICE_TYPE: monolith
      TB_SERVICE_ID: thingsboard-local
      TB_QUEUE_TYPE: kafka
      TB_KAFKA_SERVERS: kafka:9092
      ZOOKEEPER_ENABLED: "true"
      ZOOKEEPER_URL: zookeeper:2181
      CACHE_TYPE: redis
      REDIS_HOST: valkey
      JS_EVALUATOR: local
      TB_TRANSPORT_API_ENABLED: "true"
      UI_MAP_TIANDITU_DEFAULT_LAYER: ${UI_MAP_TIANDITU_DEFAULT_LAYER:-vector}
      UI_MAP_TIANDITU_DEFAULT_CENTER_LATITUDE: ${UI_MAP_TIANDITU_DEFAULT_CENTER_LATITUDE:-35.8617}
      UI_MAP_TIANDITU_DEFAULT_CENTER_LONGITUDE: ${UI_MAP_TIANDITU_DEFAULT_CENTER_LONGITUDE:-104.1954}
      UI_MAP_TIANDITU_DEFAULT_ZOOM: ${UI_MAP_TIANDITU_DEFAULT_ZOOM:-4}
      JAVA_OPTS: >-
        -Xms512m -Xmx1536m -Xss384k
        -XX:+ExitOnOutOfMemoryError
    volumes:
      - thingsboard-data:/data

  wan-transport:
    build:
      context: ../msa/transport/wan/target
    image: ${WAN_TRANSPORT_IMAGE:-thingsboard/tb-wan-transport:4.4.0-SNAPSHOT}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - kafka
      - valkey
      - zookeeper
      - thingsboard
      - mock-ns
    ports:
      - "18086:8086"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", ": > /dev/tcp/127.0.0.1/8086"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s
    environment:
      TB_SERVICE_TYPE: tb-transport
      TB_SERVICE_ID: wan-transport-local
      TB_QUEUE_TYPE: kafka
      TB_KAFKA_SERVERS: kafka:9092
      ZOOKEEPER_ENABLED: "true"
      ZOOKEEPER_URL: zookeeper:2181
      CACHE_TYPE: redis
      REDIS_HOST: valkey
      WAN_ENABLED: "true"
      WAN_CONFIG_REFRESH_INTERVAL_MS: 1000
      WAN_SYNC_POLL_INTERVAL_MS: 1000
      METRICS_ENABLED: "true"
      METRICS_ENDPOINTS_EXPOSE: health,prometheus
      WEB_APPLICATION_ENABLE: "true"
      WEB_APPLICATION_TYPE: servlet
      HTTP_BIND_PORT: 8086
      JAVA_OPTS: >-
        -Xms128m -Xmx512m -Xss384k
        -XX:+ExitOnOutOfMemoryError
    volumes:
      - ./tb-transports/wan/conf:/config:ro
      - thingsboard-wan-log:/var/log/tb-wan-transport

volumes:
  thingsboard-data:
  thingsboard-kafka-data:
  thingsboard-valkey-data:
  thingsboard-zookeeper-data:
  thingsboard-zookeeper-log:
  thingsboard-wan-log:
