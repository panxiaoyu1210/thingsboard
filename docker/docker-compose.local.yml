# Resource-conscious local topology for the current ThingsBoard source and WAN transport.
name: thingsboard-local

services:
  zookeeper:
    image: zookeeper:3.8.1
    restart: unless-stopped
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;zookeeper:2181
      ZOO_ADMINSERVER_ENABLED: "false"
    volumes:
      - thingsboard-zookeeper-data:/data
      - thingsboard-zookeeper-log:/datalog

  kafka:
    image: bitnamilegacy/kafka:4.0
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_LOG_RETENTION_BYTES: 1073741824
      KAFKA_CFG_SEGMENT_BYTES: 26214400
    volumes:
      - thingsboard-kafka-data:/bitnami/kafka

  valkey:
    image: bitnamilegacy/valkey:8.0
    restart: unless-stopped
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - thingsboard-valkey-data:/bitnami/valkey/data

  thingsboard:
    image: ${THINGSBOARD_IMAGE:-thingsboard/tb-postgres:4.4.0-SNAPSHOT}
    restart: unless-stopped
    depends_on:
      - kafka
      - valkey
      - zookeeper
    ports:
      - "19090:9090"
      - "11884:1883"
      - "15683:5683/udp"
      - "15685:5685/udp"
      - "15686:5686/udp"
    environment:
      TB_SERVICE_TYPE: monolith
      TB_SERVICE_ID: thingsboard-local
      TB_QUEUE_TYPE: kafka
      TB_KAFKA_SERVERS: kafka:9092
      ZOOKEEPER_ENABLED: "true"
      ZOOKEEPER_URL: zookeeper:2181
      CACHE_TYPE: redis
      REDIS_HOST: valkey
      JS_EVALUATOR: local
      TB_TRANSPORT_API_ENABLED: "true"
      WAN_CONNECTION_PASSWORD_ENCRYPTION_KEY: ${WAN_CONNECTION_PASSWORD_ENCRYPTION_KEY:-}
      JAVA_OPTS: >-
        -Xms512m -Xmx1536m -Xss384k
        -XX:+ExitOnOutOfMemoryError
    volumes:
      - thingsboard-data:/data

  wan-transport:
    image: ${WAN_TRANSPORT_IMAGE:-thingsboard/tb-wan-transport:4.4.0-SNAPSHOT}
    restart: unless-stopped
    depends_on:
      - kafka
      - valkey
      - zookeeper
      - thingsboard
    environment:
      TB_SERVICE_TYPE: tb-transport
      TB_SERVICE_ID: wan-transport-local
      TB_QUEUE_TYPE: kafka
      TB_KAFKA_SERVERS: kafka:9092
      ZOOKEEPER_ENABLED: "true"
      ZOOKEEPER_URL: zookeeper:2181
      CACHE_TYPE: redis
      REDIS_HOST: valkey
      WAN_ENABLED: "true"
      WAN_CONFIG_REFRESH_INTERVAL_MS: 5000
      WAN_CONNECTION_PASSWORD_ENCRYPTION_KEY: ${WAN_CONNECTION_PASSWORD_ENCRYPTION_KEY:-}
      JAVA_OPTS: >-
        -Xms128m -Xmx512m -Xss384k
        -XX:+ExitOnOutOfMemoryError
    volumes:
      - ./tb-transports/wan/conf:/config:ro
      - thingsboard-wan-log:/var/log/tb-wan-transport

volumes:
  thingsboard-data:
  thingsboard-kafka-data:
  thingsboard-valkey-data:
  thingsboard-zookeeper-data:
  thingsboard-zookeeper-log:
  thingsboard-wan-log:
