name: ${COMPOSE_PROJECT_NAME:-thingsboard-prod}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 100m
    max-file: "10"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    logging: *default-logging

  zookeeper:
    image: ${ZOOKEEPER_IMAGE:-zookeeper:3.8.1}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ZOO_MY_ID: "1"
      ZOO_SERVERS: server.1=zookeeper:2888:3888;zookeeper:2181
      ZOO_ADMINSERVER_ENABLED: "false"
    volumes:
      - zookeeper-data:/data
      - zookeeper-log:/datalog
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: ${ZOOKEEPER_MEMORY_LIMIT:-512m}
    logging: *default-logging

  kafka:
    image: ${KAFKA_IMAGE:-bitnamilegacy/kafka:4.0}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_LOG_RETENTION_BYTES: "1073741824"
      KAFKA_CFG_SEGMENT_BYTES: "26214400"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    mem_limit: ${KAFKA_MEMORY_LIMIT:-2g}
    logging: *default-logging

  valkey:
    image: ${VALKEY_IMAGE:-bitnamilegacy/valkey:8.0}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ALLOW_EMPTY_PASSWORD: "no"
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
    volumes:
      - valkey-data:/bitnami/valkey/data
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$${VALKEY_PASSWORD}\" /opt/bitnami/valkey/bin/valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: ${VALKEY_MEMORY_LIMIT:-768m}
    logging: *default-logging

  thingsboard:
    image: ${THINGSBOARD_IMAGE:?THINGSBOARD_IMAGE is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      valkey:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    ports:
      - "${TB_WEB_BIND_ADDRESS:-127.0.0.1}:${TB_HTTP_PORT:-8080}:8080"
      - "${TB_MQTT_BIND_ADDRESS:-127.0.0.1}:${TB_MQTT_PORT:-1883}:1883"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      TB_SERVICE_TYPE: monolith
      TB_SERVICE_ID: thingsboard-prod
      HTTP_BIND_PORT: "8080"
      HTTP_FORWARD_HEADERS_STRATEGY: framework
      DATABASE_TS_TYPE: sql
      SPRING_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SQL_POSTGRES_TS_KV_PARTITIONING: MONTHS
      TB_QUEUE_TYPE: kafka
      TB_KAFKA_SERVERS: kafka:9092
      ZOOKEEPER_ENABLED: "true"
      ZOOKEEPER_URL: zookeeper:2181
      CACHE_TYPE: redis
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      JS_EVALUATOR: local
      TRANSPORT_TYPE: local
      TB_TRANSPORT_API_ENABLED: "true"
      WAN_CONNECTION_PASSWORD_ENCRYPTION_KEY: ${WAN_CONNECTION_PASSWORD_ENCRYPTION_KEY:?WAN encryption key is required}
      UI_MAP_TIANDITU_API_KEY: ${UI_MAP_TIANDITU_API_KEY:?Tianditu API key is required}
      UI_MAP_TIANDITU_DEFAULT_LAYER: ${UI_MAP_TIANDITU_DEFAULT_LAYER:-vector}
      UI_MAP_TIANDITU_DEFAULT_CENTER_LATITUDE: ${UI_MAP_TIANDITU_DEFAULT_CENTER_LATITUDE:-35.8617}
      UI_MAP_TIANDITU_DEFAULT_CENTER_LONGITUDE: ${UI_MAP_TIANDITU_DEFAULT_CENTER_LONGITUDE:-104.1954}
      UI_MAP_TIANDITU_DEFAULT_ZOOM: ${UI_MAP_TIANDITU_DEFAULT_ZOOM:-4}
      JAVA_OPTS: ${TB_JAVA_OPTS:--Xms1g -Xmx4g -Xss384k -XX:+ExitOnOutOfMemoryError}
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", ": > /dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
    mem_limit: ${TB_MEMORY_LIMIT:-5g}
    logging: *default-logging

  wan-transport:
    image: ${WAN_TRANSPORT_IMAGE:?WAN_TRANSPORT_IMAGE is required}
    restart: unless-stopped
    depends_on:
      thingsboard:
        condition: service_healthy
      kafka:
        condition: service_healthy
      valkey:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    ports:
      - "${WAN_METRICS_BIND_ADDRESS:-127.0.0.1}:${WAN_METRICS_PORT:-8086}:8086"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      TB_SERVICE_TYPE: tb-transport
      TB_SERVICE_ID: wan-transport-prod
      TB_QUEUE_TYPE: kafka
      TB_KAFKA_SERVERS: kafka:9092
      ZOOKEEPER_ENABLED: "true"
      ZOOKEEPER_URL: zookeeper:2181
      CACHE_TYPE: redis
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      WAN_ENABLED: "true"
      WAN_CONFIG_REFRESH_INTERVAL_MS: ${WAN_CONFIG_REFRESH_INTERVAL_MS:-30000}
      WAN_SYNC_POLL_INTERVAL_MS: ${WAN_SYNC_POLL_INTERVAL_MS:-30000}
      WAN_CONNECTION_PASSWORD_ENCRYPTION_KEY: ${WAN_CONNECTION_PASSWORD_ENCRYPTION_KEY:?WAN encryption key is required}
      METRICS_ENABLED: "true"
      METRICS_ENDPOINTS_EXPOSE: health,prometheus
      WEB_APPLICATION_ENABLE: "true"
      WEB_APPLICATION_TYPE: servlet
      HTTP_BIND_PORT: "8086"
      JAVA_OPTS: ${WAN_JAVA_OPTS:--Xms256m -Xmx1g -Xss384k -XX:+ExitOnOutOfMemoryError}
    volumes:
      - ./wan/conf/tb-wan-transport.conf:/config/tb-wan-transport.conf:ro
      - ./wan/conf/logback.xml:/config/logback.xml:ro
      - wan-log:/var/log/tb-wan-transport
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", ": > /dev/tcp/127.0.0.1/8086"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    mem_limit: ${WAN_MEMORY_LIMIT:-1536m}
    logging: *default-logging

volumes:
  postgres-data:
  kafka-data:
  valkey-data:
  zookeeper-data:
  zookeeper-log:
  wan-log:
